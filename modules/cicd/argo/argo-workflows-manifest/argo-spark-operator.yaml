apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: spark-operator
  namespace: argo-workflows
spec:
  arguments: {}
  entrypoint: sparkapp-operator-test
  nodeSelector:
    NodeGroupType: SparkComputeOptimized  #NodeGroupType: SparkComputeOptimized  from NodePool
    karpenter.sh/capacity-type: "spot"
  tolerations:
    - key: "spark-compute-optimized"  ##name: spark-compute-optimized from NodePool
      operator: "Exists"
      effect: "NoSchedule"
  templates:
    - name: sparkapp-operator-test
      resource:
        action: create
        manifest: |
          apiVersion: "sparkoperator.k8s.io/v1beta2"
          kind: SparkApplication
          metadata:
            name: pyspark-pi-karpenter-compute
            namespace: spark-team-01
          spec:
            type: Python
            pythonVersion: "3"
            mode: cluster
            image: "apache/spark:v3.5.0"
            imagePullPolicy: Always
            mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
            sparkVersion: "3.5.0"
            restartPolicy:
              type: OnFailure
              onFailureRetries: 1
              onFailureRetryInterval: 10
              onSubmissionFailureRetries: 5
              onSubmissionFailureRetryInterval: 20
            driver:
              cores: 1
              coreLimit: "1200m"
              memory: "4g"
              labels:
                version: 3.1.1
              serviceAccount: spark-team-01
              # Using Karpenter provisioner nodeSelectors and tolerations
              nodeSelector:
                NodeGroupType: SparkComputeOptimized
                karpenter.sh/capacity-type: "spot"
              tolerations:
                - key: "spark-compute-optimized"
                  operator: "Exists"
                  effect: "NoSchedule"
            executor:
              cores: 1
              instances: 4
              memory: "4g"
              serviceAccount: spark-team-01
              labels:
                version: 3.1.1
              # Using Karpenter provisioner nodeSelectors and tolerations
              nodeSelector:
                NodeGroupType: SparkComputeOptimized
                karpenter.sh/capacity-type: "spot"
              tolerations:
                - key: "spark-compute-optimized"
                  operator: "Exists"
                  effect: "NoSchedule"