
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spark-graviton-compute-optimized
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: spark-graviton-compute-optimized-ec2
      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["arm64"]
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["c"]
        - key: "karpenter.k8s.aws/instance-family"
          operator: In
          values: ["c7gd"]
        - key: "karpenter.k8s.aws/instance-cpu"
          operator: In
          values: ["4", "8", "16"]
        - key: "karpenter.k8s.aws/instance-hypervisor"
          operator: In
          values: ["nitro"]
        - key: "karpenter.k8s.aws/instance-generation"
          operator: Gt
          values: ["2"]
  limits:
    cpu: 1000
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
    expireAfter: 48h
  weight: 50
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: spark-graviton-compute-optimized-ec2
spec:
  amiSelectorTerms:
    - tags:
        karpenter.k8s.aws/amiFamily: AL2
  role: "KarpenterNodeRole-EKS-01"
  subnetSelectorTerms:
    - tags:
        Name: "EKS-01-private*"
        karpenter.sh/discovery: "EKS-01"
  securityGroupSelectorTerms:
    - tags:
        Name: "EKS-01-node"
        karpenter.sh/discovery: "EKS-01"
  instanceStorePolicy: RAID0
  tags:
    karpenter.sh/discovery: "EKS-01"
    type: karpenter
    NodeGroupType: SparkGravitonComputeOptimized
    multiArch: Spark