---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spark-compute-optimized
spec:
  template:
    metadata:
      labels:
        intent: apps
        type: sparkTeam01
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: spark-compute-optimized-ec2
      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["c"]
        - key: "karpenter.k8s.aws/instance-family"
          operator: In
          values: ["c5d"]
        - key: "karpenter.k8s.aws/instance-cpu"
          operator: In
          values: ["4", "8"]
        - key: "karpenter.k8s.aws/instance-hypervisor"
          operator: In
          values: ["nitro"]
        - key: "karpenter.k8s.aws/instance-generation"
          operator: Gt
          values: ["2"]
      taints:
        - effect: NoSchedule
          key: spark-compute-optimized
          value: sparkTeam01

  limits:
    cpu: 1000
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
    expireAfter: 48h
  weight: 100
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: spark-compute-optimized-ec2
spec:
  amiFamily: AL2
  amiSelectorTerms:
    - tags:
        karpenter.k8s.aws/amiFamily: AL2
  role: "KarpenterNodeRole-EKS-01"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "EKS-01"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "EKS-01"
  tags:
    Name: karpenter.sh/nodepool/default
    NodeType: "karpenter-spark"
    IntentLabel: "apps"