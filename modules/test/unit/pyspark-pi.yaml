apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: pyspark-pi
  namespace: spark-team-dev
  annotations:
    yunikorn.apache.org/queue: "root.spark"
  #labels:
    #type: general
    #NodeGroupType: general
    #multiArch: Spark
    #queue: "root.default"
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "public.ecr.aws/data-on-eks/spark:3.5.3-scala2.12-java17-python3-ubuntu"
  imagePullPolicy: Always
  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
  sparkVersion: "3.5.3"
  batchScheduler: yunikorn
  batchSchedulerOptions:
    queue: root.spark
    gangSchedulingStyle: "Hard"
    placeholderTimeoutSeconds: 30
  restartPolicy:
    type: OnFailure
    onFailureRetries: 1
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.5.3
    serviceAccount: spark-team-dev
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: 'karpenter.sh/capacity-type'
                  operator: In
                  values:
                    - "on-demand"

  executor:
    cores: 1
    instances: 2
    memory: "512m"
    serviceAccount: spark-team-dev
    labels:
      version: 3.5.3
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: 'karpenter.sh/capacity-type'
                  operator: In
                  values:
                    - "spot"
