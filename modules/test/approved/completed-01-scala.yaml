apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi-scala
  namespace: spark-team-dev
spec:
  type: Scala
  mode: cluster
  image: "apache/spark:3.5.1"  # Use the official Apache Spark image
  imagePullPolicy: Always
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: "local:///opt/spark/examples/jars/spark-examples_2.12-3.5.1.jar"
  sparkVersion: "3.5.1"  # Specify the Spark version explicitly
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 10
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 20
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"  # Reduced memory to ensure it's within limits
    labels:
      version: 3.5.1
    serviceAccount: spark-team-dev
  executor:
    cores: 1
    instances: 2
    memory: "512m"
    labels:
      version: 3.5.1
  volumes:
    - name: "spark-driver-volume"
      persistentVolumeClaim:
        claimName: spark-driver-pvc
  sparkConf:
    "spark.kubernetes.node.selector.NodeGroupType": "SparkComputeOptimized"
    #"spark.kubernetes.driver.label.yunikorn.apache.org/queue": "root.spark"
    #"spark.kubernetes.executor.label.yunikorn.apache.org/queue": "root.spark"
    "spark.kubernetes.driver.tolerations": "dedicated=spark:NoSchedule"
    "spark.kubernetes.executor.tolerations": "dedicated=spark:NoSchedule"