apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spark-compute
spec:
  template:
    metadata:
      labels:
        type: karpenter
        NodeGroupType: SparkComputeOptimized
        yunikorn.apache.org/queue: "root.spark"
        yunikorn.apache.org/scheduler: "true"

    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand","spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
        - key: spark.team.dev/scala
          operator: Exists
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: spark-compute
      expireAfter: 24h
  weight: 100
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: spark-compute
spec:
  instanceProfile: "KarpenterNodeInstanceProfile-EKS-02"
  amiSelectorTerms:
    - alias: al2023@latest
  #role: "KarpenterNodeRole-EKS-02"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "EKS-02"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "EKS-02"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
    #metadataOptions:
    #httpEndpoint: enabled
    #httpProtocolIPv6: disabled
    #httpPutResponseHopLimit: 2
    #httpTokens: required
  instanceStorePolicy: RAID0
  #status:
  #instanceProfile: "KarpenterNodeInstanceProfile-EKS-02"
