apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: monitoring-compute
spec:
  template:
    metadata:
      labels:
        type: monitor
        NodeGroupType: MonitoringComputeOptimized
        yunikorn.apache.org/queue: "root.monitoring"
        yunikorn.apache.org/scheduler: "true"
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m", "r"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
        - key: monitoring.space.eks/monitor
          operator: Exists
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: monitoring-compute
      expireAfter: Never
  #weight: 10   #is removed when it is not necessary a single node
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
  limits:
    cpu: 34
    memory: 8Gi
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: monitoring-compute
spec:
  instanceProfile: "KarpenterNodeInstanceProfile-EKS-02"
  amiSelectorTerms:
    - alias: al2023@latest
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "EKS-02"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "EKS-02"
  instanceStorePolicy: RAID0
  tags:
    intent: monitoring

