apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: spark-pi
  namespace: spark-team-dev
  labels:
    app: "pyspark-pi"
    applicationId: "pyspark-pi-karpenter"
    queue: root.test
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "public.ecr.aws/data-on-eks/spark3.3.1-hadoop3.2-aws-java-sdk-bundle-1.12.647"
  imagePullPolicy: Always
  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
  sparkVersion: "3.3.1"
  #nodeSelector:
    #type: karpenter
  restartPolicy:
    type: Never
  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "4g"
    labels:
      version: 3.3.1
    serviceAccount: spark-team-dev
    #nodeSelector:
      #NodeGroupType: SparkComputeOptimized
      #karpenter.sh/capacity-type: "on-demand"
    tolerations:
      - key: "spark-compute-optimized"
        operator: "Exists"
        effect: "NoSchedule"
  executor:
    cores: 1
    instances: 4
    memory: "4g"
    serviceAccount: spark-team-dev
    labels:
      version: 3.3.1
    nodeSelector:
      NodeGroupType: SparkComputeOptimized
      karpenter.sh/capacity-type: "spot"
    tolerations:
      - key: "spark-compute-optimized"
        operator: "Exists"
        effect: "NoSchedule"
  batchScheduler: yunikorn
  batchSchedulerOptions:
    queue: root.test