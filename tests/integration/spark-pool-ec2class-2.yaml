apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spark-compute-optimized-2
spec:
  template:
    metadata:
      labels:
        type: karpenter-2
        NodeGroupType: SparkComputeOptimized-2
        multiArch: Spark

    spec:
      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "karpenter.k8s.aws/instance-category"
          operator: In
          values: ["c"]
        - key: "karpenter.k8s.aws/instance-family"
          operator: In
          values: ["c5d"]
        - key: "karpenter.k8s.aws/instance-cpu"
          operator: In
          values: ["4", "8"]
        - key: "karpenter.k8s.aws/instance-hypervisor"
          operator: In
          values: ["nitro"]
        - key: "karpenter.k8s.aws/instance-generation"
          operator: Gt
          values: ["2"]
      nodeClassRef:
        group: karpenter.k8s.aws  # Updated since only a single version will be served
        kind: EC2NodeClass
        name: spark-compute-optimized-2
      expireAfter: 48h
  limits:
    cpu: 1000
  weight: 100
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: spark-compute-optimized-2
spec:
  amiSelectorTerms:
    - alias: al2023@v20240703
  role: "Core-node-EKS-01-eks-node-group-20241128181012764600000001"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "EKS-01"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "EKS=01"
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  instanceStorePolicy: RAID0

