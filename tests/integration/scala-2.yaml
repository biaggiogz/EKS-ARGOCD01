apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: testing-09
  namespace: spark-team-dev
  labels:
    app: "pyspark-pi-2"
    queue: root.default
spec:
  concurrencyPolicy: Allow
  successfulRunHistoryLimit: 1
  failedRunHistoryLimit: 3
  template:
    type: Python
    pythonVersion: "3"
    mode: cluster
    image: "public.ecr.aws/data-on-eks/spark3.3.1-hadoop3.2-aws-java-sdk-bundle-1.12.647"
    imagePullPolicy: Always
    mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
    sparkVersion: "3.3.1"
    nodeSelector:
      type: karpenter-2
    restartPolicy:
      type: OnFailure
      onFailureRetries: 1
      onFailureRetryInterval: 10
      onSubmissionFailureRetries: 5
      onSubmissionFailureRetryInterval: 20
    driver:
      cores: 1
      coreLimit: "1200m"
      memory: "4g"
      labels:
        version: 3.3.1
      serviceAccount: spark-team-dev
      # Using Karpenter provisioner nodeSelectors and tolerations
      nodeSelector:
        NodeGroupType: SparkComputeOptimized-2
        karpenter.sh/capacity-type: "on-demand"
      tolerations:
        - key: "spark-compute-optimized-2"
          operator: "Exists"
          effect: "NoSchedule"
    executor:
      cores: 1
      instances: 4
      memory: "4g"
      serviceAccount: spark-team-dev
      labels:
        version: 3.3.1
      # Using Karpenter provisioner nodeSelectors and tolerations
      nodeSelector:
        NodeGroupType: SparkComputeOptimized-2
        karpenter.sh/capacity-type: "spot"
      tolerations:
        - key: "spark-compute-optimized-2"
          operator: "Exists"
          effect: "NoSchedule"
  batchScheduler: yunikorn
  batchSchedulerOptions:
    queue: root.default