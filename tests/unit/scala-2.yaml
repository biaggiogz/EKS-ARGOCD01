apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi-yunikorn-2
  namespace: spark-team-dev
  labels:
    app: "pyspark-pi"
    queue: root.default
spec:
  type: Scala
  mode: cluster
  image: spark:3.5.3
  imagePullPolicy: IfNotPresent
  mainClass: org.apache.spark.examples.SparkPi
  mainApplicationFile: local:///opt/spark/examples/jars/spark-examples.jar
  sparkVersion: 3.5.3
  nodeSelector:
    nodeGroupType: SparkComputeOptimized-2
    karpenter.sh/capacity-type: "spot"
  driver:
    cores: 4
    memory: "16g"
    serviceAccount: spark-team-dev
    #nodeSelector:
      #nodeGroupType: SparkComputeOptimized-2
      #karpenter.sh/capacity-type: "spot"
  executor:
    instances: 6
    cores: 4
    memory: "16g"
    serviceAccount: spark-team-dev
    #nodeSelector:
      #nodeGroupType: SparkComputeOptimized-2
      #karpenter.sh/capacity-type: "spot"
  batchScheduler: yunikorn
  batchSchedulerOptions:
    queue: root.default